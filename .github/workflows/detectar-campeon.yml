name: Detectar nuevo campeón de Primera

on:
  schedule:
    # Todos los lunes a las 12:00 UTC. El fútbol argentino casi siempre
    # termina de jugarse los fines de semana, así que el lunes ya hay
    # resultado. Podés cambiar la frecuencia si querés.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  detectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar si hay un torneo recién terminado
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID || '128' }}
          SEASON: ${{ vars.SEASON || '2026' }}
          NOMBRE_TORNEO_ACTUAL: ${{ vars.NOMBRE_TORNEO_ACTUAL || 'Torneo (confirmar nombre)' }}
        run: python scripts/actualizar_campeones.py

      - name: Commitear el borrador si cambió
        run: |
          git config user.name "campeones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/campeones_borrador.json
          git diff --cached --quiet || git commit -m "Nuevo borrador de campeón detectado [revisar]"
          git push
